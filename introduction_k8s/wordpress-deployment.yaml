apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-deployment
spec:
  selector:
    matchLabels:
      app: wordpress-deployment
  template:
    metadata:
      labels:
        app: wordpress-deployment
    spec:
      containers:
      - name: wordpress-image
        image: wordpress:6.0
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
        ports:
        - containerPort: 80
        env:
          - name: WORDPRESS_DB_HOST
            value: "mysql-deployment"
          - name: WORDPRESS_DB_PASSWORD
            value: "wordpress-2020"
          - name: WORDPRESS_DB_USER
            value: "root"
          - name: WORDPRESS_DB_NAME
            value: "wordpress"

